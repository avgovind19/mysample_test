<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dynamic Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0
        }

        .card {
            width: 480px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border-radius: 8px
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
            box-sizing: border-box
        }

        button {
            padding: 10px 14px
        }

        .msg {
            margin-top: 10px
        }
    </style>
</head>

<body>
    <div class="card">
        <h2 id="title">Form</h2>
        <form id="dynamicForm"></form>
        <div class="msg" id="msg"></div>
    </div>

    <script>
        async function loadSchema() {
            try {
                const res = await fetch('/form/schema');
                const schema = await res.json();
                document.getElementById('title').textContent = schema.title || 'Form';
                const form = document.getElementById('dynamicForm');
                form.innerHTML = '';

                schema.fields.forEach(field => {
                    const wrapper = document.createElement('div');
                    const label = document.createElement('label');
                    label.textContent = field.label;
                    label.htmlFor = field.name;
                    wrapper.appendChild(label);

                    let input;
                    if (field.type === 'textarea') {
                        input = document.createElement('textarea');
                    } else {
                        input = document.createElement('input');
                        input.type = field.type || 'text';
                    }
                    input.id = field.name;
                    input.name = field.name;
                    if (field.required) input.required = true;
                    wrapper.appendChild(input);
                    form.appendChild(wrapper);
                });

                const submit = document.createElement('button');
                submit.type = 'button';
                submit.textContent = 'Submit';
                submit.addEventListener('click', submitForm);
                form.appendChild(submit);

                const saveClose = document.createElement('button');
                saveClose.type = 'button';
                saveClose.style.marginLeft = '8px';
                saveClose.textContent = 'Save and Close';
                saveClose.addEventListener('click', submitAndClose);
                form.appendChild(saveClose);
            } catch (e) {
                document.getElementById('msg').textContent = 'Failed to load form schema';
            }
        }

        async function submitForm() {
            const form = document.getElementById('dynamicForm');
            const data = {};
            Array.from(form.elements).forEach((el) => {
                if (!el.name) return;
                if (el.type === 'button') return;
                data[el.name] = el.value;
            });
            document.getElementById('msg').textContent = 'Submitting...';
            try {
                const res = await fetch('/form/submit', {
                    method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
                });
                const body = await res.json();
                if (res.ok) {
                    document.getElementById('msg').textContent = 'Submitted (id=' + body.id + ')';
                } else {
                    document.getElementById('msg').textContent = 'Submit failed';
                }
            } catch (e) {
                document.getElementById('msg').textContent = 'Network error';
            }
        }

        async function submitAndClose() {
            const form = document.getElementById('dynamicForm');
            const data = {};
            Array.from(form.elements).forEach((el) => {
                if (!el.name) return;
                if (el.type === 'button') return;
                data[el.name] = el.value;
            });
            document.getElementById('msg').textContent = 'Submitting and closing...';
            try {
                const res = await fetch('/form/submit', {
                    method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
                });
                const body = await res.json();
                if (res.ok) {
                    // server destroys session on submit; redirect user to login page to 'close' the form
                    window.location.href = '/login.html';
                } else {
                    document.getElementById('msg').textContent = 'Submit failed: ' + (body && body.errors ? body.errors.join(', ') : 'unknown');
                }
            } catch (e) {
                document.getElementById('msg').textContent = 'Network error';
            }
        }

        loadSchema();
    </script>
</body>

</html>
